name: Playwright Automation Test Report

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests with JSON report
        run: |
          npx playwright test --project=chromium --reporter=html,json > result.json
        continue-on-error: true
        env:
          CI: true

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Allure Single-File Report
        if: always()
        run: |
          mkdir -p reports
          allure generate allure-results --single-file --clean -o reports/allure-report

      - name: Rename Report File
        if: always()
        run: |
          if [ -f reports/allure-report/index.html ]; then
            cp reports/allure-report/index.html allure-report.html
          fi

      - name: Parse test results
        id: results
        run: |
          passed=$(jq '[.suites[].specs[] | select(.ok==true)] | length' result.json)
          skipped=$(jq '[.suites[].specs[] | select(.skip==true)] | length' result.json)
          failed=$(jq '[.suites[].specs[] | select(.ok==false and .skip!=true)] | length' result.json)
          echo "passed=$passed" >> $GITHUB_OUTPUT
          echo "skipped=$skipped" >> $GITHUB_OUTPUT
          echo "failed=$failed" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports
          path: |
            reports
            allure-report.html
            result.json

      # Email on failure → attach report
      - name: Send Email on Failure
        if: steps.results.outputs.failed != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Playwright Test Report - Build #${{ github.run_number }} - FAILED
          to: vijay@arizon.digital
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            Hello Team,

            Playwright automation test execution has FAILED.

            Execution Details:
            -----------------------------
            Build Number : ${{ github.run_number }}
            Branch       : ${{ github.ref_name }}
            Commit ID    : ${{ github.sha }}
            Passed       : ${{ steps.results.outputs.passed }}
            Skipped      : ${{ steps.results.outputs.skipped }}
            Failed       : ${{ steps.results.outputs.failed }}

            Please find the attached Allure report for detailed failure analysis.

            Regards,
            Arizon QA Team
          attachments: allure-report.html

      # Email on success → summary only
      - name: Send Email on Success
        if: steps.results.outputs.failed == '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Playwright Test Report - Build #${{ github.run_number }} - PASSED
          to: vijay@arizon.digital
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            Hello Team,

            Playwright automation test execution PASSED successfully.

            Execution Details:
            -----------------------------
            Build Number : ${{ github.run_number }}
            Branch       : ${{ github.ref_name }}
            Commit ID    : ${{ github.sha }}
            Passed       : ${{ steps.results.outputs.passed }}
            Skipped      : ${{ steps.results.outputs.skipped }}
            Failed       : ${{ steps.results.outputs.failed }}

            No attachments included since all tests passed.

            Regards,
            Arizon QA Team
