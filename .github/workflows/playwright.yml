name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
  - cron: '0 2 1 * *' 

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o reports/allure-report

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
          if-no-files-found: ignore

      - name: Summary Report
        if: always()
        run: |
          echo "## Test Results Summary" > test-summary.md
          echo "**Build**: ${{ github.run_number }}" >> test-summary.md
          echo "**Branch**: ${{ github.ref_name }}" >> test-summary.md
          echo "**Commit**: ${{ github.sha }}" >> test-summary.md
          echo "**Status**: ${{ job.status }}" >> test-summary.md
          echo "" >> test-summary.md
          echo "Reports are attached to this email." >> test-summary.md

      - name: Compress reports
        if: always()
        run: |
          if [ -d "reports" ] && [ "$(ls -A reports)" ]; then
            zip -r test-reports.zip reports/
          else
            echo "No reports to compress"
          fi

      - name: Send Email with Reports
        if: always()
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Playwright Test Report - Build #${{ github.run_number }}"
          to: vijay@arizon.digital
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            Exhibitor Portal Execution Report
            
            Build #${{ github.run_number }}
            Status: ${{ job.status }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            
            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            
            Allure HTML test report is attached.
            
            View full workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: test-summary.md,test-reports.zip
