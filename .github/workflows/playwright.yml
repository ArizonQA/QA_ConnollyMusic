name: Playwright Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

  schedule:
    - cron: '0 2 1 * *'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Allure Single-File Report
        if: always()
        run: |
          mkdir -p reports
          allure generate allure-results --single-file --clean -o reports/allure-report

      - name: Rename Report File
        if: always()
        run: |
          if [ -f reports/allure-report/index.html ]; then
            cp reports/allure-report/index.html allure-report.html
          fi

      - name: Create Summary
        if: always()
        run: |
          echo "## Test Execution Summary" > test-summary.md
          echo "" >> test-summary.md
          echo "Build : ${{ github.run_number }}" >> test-summary.md
          echo "Status: ${{ job.status }}" >> test-summary.md
          echo "Branch: ${{ github.ref_name }}" >> test-summary.md
          echo "Commit: ${{ github.sha }}" >> test-summary.md

      - name: Verify Files
        if: always()
        run: |
          echo "Current Directory"
          pwd

          echo ""
          echo "Generated Files"
          ls -lh

          echo ""
          echo "Reports Folder"
          ls -R reports || true

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports
          path: |
            reports
            allure-report.html
            test-summary.md

      - name: Send Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: Playwright Test Report - Build #${{ github.run_number }}

          to: vijay@arizon.digital
          from: ${{ secrets.EMAIL_USERNAME }}

          body: |
            Hello,

            Playwright execution has completed.

            Build Number : ${{ github.run_number }}
            Status       : ${{ job.status }}
            Branch       : ${{ github.ref_name }}
            Commit       : ${{ github.sha }}

            Repository   : ${{ github.repository }}
            Workflow     : ${{ github.workflow }}

            The Allure report is attached as a single HTML file — just open it in any browser.

            Workflow URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          attachments: |
            test-summary.md
            allure-report.html